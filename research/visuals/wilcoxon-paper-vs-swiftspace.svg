<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Paper and SwiftSpace paired comparison</title>
  <desc id="desc">Exact paired Wilcoxon signed-rank tests on 30 complete participant pairs. Median time was 2.46 minutes on paper and 1.59 minutes in SwiftSpace; this difference was not clear after adjustment for three tests. Median fit problems were 0 on paper and 2 in SwiftSpace, with more problems in SwiftSpace; an exact paired sign-test check confirmed this result after adjustment. Median rearrangements were 0 for both methods, with no clear difference. Count results have many ties and zero differences, so interpret cautiously.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ed5514"/>
      <stop offset="1" stop-color="#a5220d"/>
    </linearGradient>
    <style>text { font-family: Arial, Helvetica, sans-serif; }</style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1060" height="112" fill="#252525"/>
  <rect x="1074" width="126" height="112" fill="#ff9d12"/>
  <rect x="24" y="20" width="12" height="74" rx="3" fill="#ff9d12"/>
  <text x="60" y="72" fill="#fffaf2" font-size="34" font-weight="700">Paper vs. SwiftSpace</text>
  <text x="54" y="157" fill="#fffaf2" font-size="23" font-weight="600">How did the same participants’ results compare?</text>

  <rect x="48" y="190" width="1104" height="405" rx="16" fill="#fffaf2"/>
  <text x="82" y="235" fill="#625951" font-size="17" font-weight="700">30 COMPLETE PARTICIPANT PAIRS</text>
  <text x="82" y="285" fill="#252525" font-size="18" font-weight="700">Measure</text>
  <text x="350" y="285" fill="#252525" font-size="18" font-weight="700">Paper median</text>
  <text x="520" y="285" fill="#252525" font-size="18" font-weight="700">SwiftSpace median</text>
  <text x="760" y="285" fill="#252525" font-size="18" font-weight="700">Finding</text>
  <line x1="82" y1="302" x2="1118" y2="302" stroke="#ded3c8" stroke-width="2"/>

  <text x="82" y="354" fill="#252525" font-size="20" font-weight="700">Planning time</text>
  <text x="350" y="354" fill="#252525" font-size="20">2.46 min</text>
  <text x="520" y="354" fill="#252525" font-size="20">1.59 min</text>
  <text x="760" y="345" fill="#51483f" font-size="18" font-weight="700">No clear difference*</text>
  <text x="760" y="369" fill="#766b63" font-size="15">adjusted p = .052</text>
  <line x1="82" y1="390" x2="1118" y2="390" stroke="#eee5dc"/>

  <text x="82" y="442" fill="#252525" font-size="20" font-weight="700">Fit problems</text>
  <text x="350" y="442" fill="#252525" font-size="20">0</text>
  <text x="520" y="442" fill="#252525" font-size="20">2</text>
  <text x="760" y="433" fill="#a33c1c" font-size="18" font-weight="700">More in SwiftSpace</text>
  <text x="760" y="457" fill="#766b63" font-size="15">adjusted p &lt; .001</text>
  <line x1="82" y1="478" x2="1118" y2="478" stroke="#eee5dc"/>

  <text x="82" y="530" fill="#252525" font-size="20" font-weight="700">Rearrangements</text>
  <text x="350" y="530" fill="#252525" font-size="20">0</text>
  <text x="520" y="530" fill="#252525" font-size="20">0</text>
  <text x="760" y="521" fill="#51483f" font-size="18" font-weight="700">No clear difference</text>
  <text x="760" y="545" fill="#766b63" font-size="15">adjusted p = .497</text>

  <rect x="82" y="558" width="1036" height="28" rx="6" fill="#f7eee3"/>
  <text x="94" y="577" fill="#51483f" font-size="13">*Time looked lower in SwiftSpace before adjustment, but not after correcting for three comparisons.</text>
  <text x="48" y="620" fill="#fff4e7" font-size="14">Exact paired Wilcoxon; p-values adjusted for 3 measures. Sign-test check also found more SwiftSpace fit problems (adjusted p = .003).</text>
</svg>
