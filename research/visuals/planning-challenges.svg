<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Common room-planning challenges</title>
  <desc id="desc">Three challenges: more time spent planning, repeated furniture rearrangements, and furniture that does not fit the intended space.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ed5514"/>
      <stop offset="1" stop-color="#a5220d"/>
    </linearGradient>
    <style>text { font-family: Arial, Helvetica, sans-serif; }</style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1060" height="112" fill="#252525"/>
  <rect x="1074" width="126" height="112" fill="#ff9d12"/>
  <rect x="24" y="20" width="12" height="74" rx="3" fill="#ff9d12"/>
  <text x="60" y="72" fill="#fffaf2" font-size="34" font-weight="700">Room-planning challenges</text>

  <g transform="translate(70 178)">
    <rect width="320" height="390" rx="18" fill="#fffaf2"/>
    <circle cx="160" cy="112" r="66" fill="#f7eee3"/>
    <circle cx="160" cy="112" r="39" fill="none" stroke="#e95517" stroke-width="9"/>
    <path d="M160 85v29l21 14" fill="none" stroke="#e95517" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="160" y="250" fill="#252525" font-size="27" font-weight="700" text-anchor="middle">More time</text>
    <text x="160" y="288" fill="#51483f" font-size="21" text-anchor="middle">spent planning</text>
  </g>

  <g transform="translate(440 178)">
    <rect width="320" height="390" rx="18" fill="#fffaf2"/>
    <circle cx="160" cy="112" r="66" fill="#f7eee3"/>
    <path d="M124 101a39 39 0 0 1 66-23l12 13m-1-22v22h-22M196 123a39 39 0 0 1-66 23l-12-13m1 22v-22h22" fill="none" stroke="#e95517" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="160" y="250" fill="#252525" font-size="27" font-weight="700" text-anchor="middle">Repeated</text>
    <text x="160" y="288" fill="#51483f" font-size="21" text-anchor="middle">furniture moves</text>
  </g>

  <g transform="translate(810 178)">
    <rect width="320" height="390" rx="18" fill="#fffaf2"/>
    <circle cx="160" cy="112" r="66" fill="#f7eee3"/>
    <rect x="111" y="79" width="98" height="66" rx="5" fill="none" stroke="#6d6259" stroke-width="6" stroke-dasharray="9 7"/>
    <rect x="144" y="95" width="68" height="54" rx="7" fill="#e95517"/>
    <path d="M151 91l-12-12m62 12l12-12m-62 66l-12 12m62-12l12 12" stroke="#e95517" stroke-width="6" stroke-linecap="round"/>
    <text x="160" y="250" fill="#252525" font-size="27" font-weight="700" text-anchor="middle">Poor fit</text>
    <text x="160" y="288" fill="#51483f" font-size="20" text-anchor="middle">furniture doesn’t fit</text>
    <text x="160" y="318" fill="#51483f" font-size="20" text-anchor="middle">the intended space</text>
  </g>
</svg>
