<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Question 5: What was linked to SwiftSpace planning time?</title>
  <desc id="desc">An exploratory analysis of 38 SwiftSpace room sessions from 28 accounts found that sessions with more furniture placed tended to take less time, and designer accounts tended to take longer than homeowner accounts. Room size showed no clear relationship. Account role is only a proxy for prior design experience.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ed5514"/>
      <stop offset="1" stop-color="#a5220d"/>
    </linearGradient>
    <style>text { font-family: Arial, Helvetica, sans-serif; }</style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1060" height="112" fill="#252525"/>
  <rect x="1074" width="126" height="112" fill="#ff9d12"/>
  <rect x="24" y="20" width="12" height="74" rx="3" fill="#ff9d12"/>
  <text x="60" y="72" fill="#fffaf2" font-size="34" font-weight="700">Question 5</text>
  <text x="54" y="157" fill="#fffaf2" font-size="23" font-weight="600">What was linked to SwiftSpace planning time?</text>
  <rect x="48" y="190" width="1104" height="405" rx="16" fill="#fffaf2"/>
  <text x="82" y="238" fill="#625951" font-size="18" font-weight="700">38 ROOM SESSIONS · 28 ACCOUNTS</text>
  <text x="82" y="293" fill="#252525" font-size="19" font-weight="700">Factor</text>
  <text x="450" y="293" fill="#252525" font-size="19" font-weight="700">What we found</text>
  <text x="960" y="293" fill="#252525" font-size="19" font-weight="700">Evidence</text>
  <line x1="82" y1="310" x2="1118" y2="310" stroke="#ded3c8" stroke-width="2"/>
  <text x="82" y="369" fill="#252525" font-size="22" font-weight="700">Furniture items placed</text>
  <text x="450" y="369" fill="#252525" font-size="21">About 0.6 min less per added item</text>
  <text x="960" y="369" fill="#25745a" font-size="20" font-weight="700">Clear link</text>
  <line x1="82" y1="390" x2="1118" y2="390" stroke="#eee5dc"/>
  <text x="82" y="449" fill="#252525" font-size="22" font-weight="700">Room size</text>
  <text x="450" y="449" fill="#252525" font-size="21">No clear relationship found</text>
  <text x="960" y="449" fill="#8a6b4d" font-size="20" font-weight="700">Unclear</text>
  <line x1="82" y1="470" x2="1118" y2="470" stroke="#eee5dc"/>
  <text x="82" y="529" fill="#252525" font-size="22" font-weight="700">Account role*</text>
  <text x="450" y="529" fill="#252525" font-size="21">Interior designer accounts: about 1.3 min longer</text>
  <text x="960" y="529" fill="#25745a" font-size="20" font-weight="700">Clear link</text>
  <rect x="82" y="550" width="1036" height="40" rx="8" fill="#f7eee3"/>
  <text x="98" y="575" fill="#51483f" font-size="15">*Account role is only a rough stand-in for experience. Times are from SwiftSpace timers, not paper planning.</text>
  <text x="48" y="632" fill="#fff4e7" font-size="15">Exploratory results: the data show links, not causes.</text>
</svg>
