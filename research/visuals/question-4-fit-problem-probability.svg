<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Question 4: Probability of a furniture-fit problem</title>
  <desc id="desc">In paper-planning results from 30 tasks, 6 had at least one furniture-fit problem and 24 had none. The observed proportion with a fit problem is 20 percent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ed5514"/>
      <stop offset="1" stop-color="#a5220d"/>
    </linearGradient>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1060" height="112" fill="#252525"/>
  <rect x="1074" width="126" height="112" fill="#ff9d12"/>
  <rect x="24" y="20" width="12" height="74" rx="3" fill="#ff9d12"/>
  <text x="60" y="72" fill="#fffaf2" font-size="34" font-weight="700">Question 4</text>

  <text x="54" y="164" fill="#fffaf2" font-size="23" font-weight="600">What is the probability a room plan made using the current</text>
  <text x="54" y="196" fill="#fffaf2" font-size="23" font-weight="600">approach will have at least one furniture-fit problem?</text>

  <rect x="48" y="228" width="1104" height="386" rx="16" fill="#fffaf2"/>
  <text x="88" y="278" fill="#625951" font-size="16" font-weight="700" letter-spacing="1">PAPER-PLANNING RESULTS · 30 TASKS</text>
  <text x="78" y="416" fill="#e95517" font-size="112" font-weight="800">20%</text>
  <text x="88" y="459" fill="#252525" font-size="22" font-weight="700">6 of 30 plans had at least</text>
  <text x="88" y="489" fill="#252525" font-size="22" font-weight="700">one furniture-fit problem.</text>

  <line x1="478" y1="310" x2="478" y2="556" stroke="#e3d8ce" stroke-width="2"/>
  <text x="526" y="339" fill="#252525" font-size="20" font-weight="700">Plans with a fit problem</text>
  <text x="526" y="367" fill="#766b63" font-size="15">Share of paper-planned tasks</text>
  <rect x="526" y="402" width="560" height="64" rx="9" fill="#e8dfd6"/>
  <path d="M535 402 H638 V466 H535 Q526 466 526 457 V411 Q526 402 535 402 Z" fill="#e95517"/>
  <text x="582" y="442" fill="#fffaf2" font-size="17" font-weight="700" text-anchor="middle">YES · 6</text>
  <text x="862" y="442" fill="#252525" font-size="17" font-weight="700" text-anchor="middle">NO · 24</text>
  <text x="526" y="509" fill="#766b63" font-size="15">Observed probability: 6 ÷ 30 = 0.20</text>
  <text x="526" y="544" fill="#766b63" font-size="15">Estimated from this respondent group.</text>
</svg>
