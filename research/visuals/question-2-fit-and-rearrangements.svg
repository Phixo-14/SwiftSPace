<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Question 2: Furniture-fit problems and rearrangements</title>
  <desc id="desc">Across 30 paper-planning tasks, respondents reported an average of 0.30 furniture-fit problems and 0.40 furniture rearrangements per task.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ed5514"/>
      <stop offset="1" stop-color="#a5220d"/>
    </linearGradient>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1060" height="112" fill="#252525"/>
  <rect x="1074" width="126" height="112" fill="#ff9d12"/>
  <rect x="24" y="20" width="12" height="74" rx="3" fill="#ff9d12"/>
  <text x="60" y="72" fill="#fffaf2" font-size="34" font-weight="700">Question 2</text>

  <text x="54" y="164" fill="#fffaf2" font-size="23" font-weight="600">How often do fit problems or furniture rearrangements happen</text>
  <text x="54" y="196" fill="#fffaf2" font-size="23" font-weight="600">when planning without a visualization tool?</text>

  <rect x="48" y="228" width="1104" height="386" rx="16" fill="#fffaf2"/>
  <text x="88" y="278" fill="#625951" font-size="16" font-weight="700" letter-spacing="1">AVERAGE COUNT PER PAPER-PLANNING TASK · 30 RESPONDENTS</text>

  <text x="88" y="347" fill="#252525" font-size="20" font-weight="700">Furniture-fit problems</text>
  <text x="88" y="377" fill="#766b63" font-size="15">Average count per task</text>
  <rect x="390" y="331" width="480" height="42" rx="7" fill="#eadfd5"/>
  <rect x="390" y="331" width="288" height="42" rx="7" fill="#e95517"/>
  <text x="894" y="361" fill="#252525" font-size="23" font-weight="700">0.30</text>

  <text x="88" y="445" fill="#252525" font-size="20" font-weight="700">Furniture rearrangements</text>
  <text x="88" y="475" fill="#766b63" font-size="15">Average count per task</text>
  <rect x="390" y="429" width="480" height="42" rx="7" fill="#eadfd5"/>
  <rect x="390" y="429" width="384" height="42" rx="7" fill="#e95517"/>
  <text x="894" y="459" fill="#252525" font-size="23" font-weight="700">0.40</text>

  <line x1="390" y1="509" x2="870" y2="509" stroke="#625951" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#625951" text-anchor="middle">
    <line x1="390" y1="509" x2="390" y2="517" stroke="#625951" stroke-width="2"/><text x="390" y="540">0</text>
    <line x1="486" y1="509" x2="486" y2="517" stroke="#625951" stroke-width="2"/><text x="486" y="540">0.1</text>
    <line x1="582" y1="509" x2="582" y2="517" stroke="#625951" stroke-width="2"/><text x="582" y="540">0.2</text>
    <line x1="678" y1="509" x2="678" y2="517" stroke="#625951" stroke-width="2"/><text x="678" y="540">0.3</text>
    <line x1="774" y1="509" x2="774" y2="517" stroke="#625951" stroke-width="2"/><text x="774" y="540">0.4</text>
    <line x1="870" y1="509" x2="870" y2="517" stroke="#625951" stroke-width="2"/><text x="870" y="540">0.5</text>
  </g>
  <text x="88" y="580" fill="#766b63" font-size="14">Counts are averaged across completed paper-planning tasks.</text>
</svg>
