<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Room planning time without a dedicated tool</title>
  <desc id="desc">Average planning time was 2.38 minutes among 30 respondents. Eight took under two minutes, twelve took two to under three minutes, and ten took three minutes or more.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ed5514"/>
      <stop offset="1" stop-color="#a5220d"/>
    </linearGradient>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1060" height="112" fill="#252525"/>
  <rect x="1074" width="126" height="112" fill="#ff9d12"/>
  <text x="48" y="43" fill="#ff9d12" font-size="17" font-weight="700" letter-spacing="2">QUESTION 1</text>
  <text x="48" y="84" fill="#fffaf2" font-size="30" font-weight="700">Planning time without a dedicated tool</text>

  <rect x="48" y="148" width="1104" height="470" rx="16" fill="#fffaf2"/>
  <text x="92" y="205" fill="#625951" font-size="17" font-weight="700" letter-spacing="1">AVERAGE TIME</text>
  <text x="88" y="320" fill="#e95517" font-size="92" font-weight="800">2.38</text>
  <text x="94" y="356" fill="#252525" font-size="22" font-weight="700">minutes</text>
  <text x="94" y="399" fill="#625951" font-size="16">30 respondents</text>

  <line x1="430" y1="188" x2="430" y2="570" stroke="#e3d8ce" stroke-width="2"/>
  <text x="478" y="205" fill="#252525" font-size="23" font-weight="700">Respondents by time spent</text>
  <text x="478" y="234" fill="#766b63" font-size="15">Number of respondents</text>

  <text x="478" y="299" fill="#39332f" font-size="17" font-weight="600">Under 2 min</text>
  <rect x="675" y="274" width="350" height="32" rx="6" fill="#eadfd5"/>
  <rect x="675" y="274" width="233.3" height="32" rx="6" fill="#e95517"/>
  <text x="1062" y="298" fill="#252525" font-size="18" font-weight="700">8</text>

  <text x="478" y="382" fill="#39332f" font-size="17" font-weight="600">2 to under 3 min</text>
  <rect x="675" y="357" width="350" height="32" rx="6" fill="#eadfd5"/>
  <rect x="675" y="357" width="350" height="32" rx="6" fill="#e95517"/>
  <text x="1062" y="381" fill="#252525" font-size="18" font-weight="700">12</text>

  <text x="478" y="465" fill="#39332f" font-size="17" font-weight="600">3 min or more</text>
  <rect x="675" y="440" width="350" height="32" rx="6" fill="#eadfd5"/>
  <rect x="675" y="440" width="291.7" height="32" rx="6" fill="#e95517"/>
  <text x="1062" y="464" fill="#252525" font-size="18" font-weight="700">10</text>

  <text x="478" y="540" fill="#766b63" font-size="15">Most respondents planned their layout in 2 to under 3 minutes.</text>
</svg>
