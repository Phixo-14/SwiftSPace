name: MongoDB backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Create MongoDB backup
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          set -e

          backup_root="$GITHUB_WORKSPACE/backups"

          # Remove stale root-owned directory from previous failed runs.
          rm -rf "$backup_root"
          mkdir -p "$backup_root"

          # Make sure the runner user owns the backup folder.
          chown -R "$(id -u):$(id -g)" "$backup_root"
          chmod -R u+rwX "$backup_root"

          timestamp=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          output_dir="$backup_root/$timestamp"
          mkdir -p "$output_dir"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$backup_root:/backups" \
            mongo:7 \
            sh -c 'mongodump --uri="$1" --out="/backups/$0"' "$timestamp" "$MONGO_URI"

      - name: Commit backup files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups
          if git diff --cached --quiet; then
            echo "No backup changes to commit."
            exit 0
          fi
          git commit -m "chore: backup MongoDB database"
          git push
