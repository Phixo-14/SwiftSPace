name: MongoDB backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Create MongoDB backup
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/backups"
          timestamp=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          output_dir="$GITHUB_WORKSPACE/backups/$timestamp"
          mkdir -p "$output_dir"

          docker run --rm \
            -v "$GITHUB_WORKSPACE/backups:/backups" \
            mongo:7 \
            mongodump --uri="$MONGO_URI" --out="/backups/$timestamp"

      - name: Commit backup files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups
          if git diff --cached --quiet; then
            echo "No backup changes to commit."
            exit 0
          fi
          git commit -m "chore: backup MongoDB database"
          git push
